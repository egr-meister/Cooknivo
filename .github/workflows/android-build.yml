name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed release APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36 and Build Tools 36.0.0
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1 (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Ensure Gradle wrapper is present
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Wrapper jar missing; generating it with Gradle 8.11.1."
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi
          chmod +x ./gradlew

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "Keystore decoded to a temporary file."

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Locate release APK
        id: findapk
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK found."
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Verify APK signature and certificate
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APK="${{ steps.findapk.outputs.apk }}"
          CERT_OUTPUT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")
          echo "$CERT_OUTPUT"
          if echo "$CERT_OUTPUT" | grep -q "CN=Android Debug"; then
            echo "::error::Release APK is signed with the Android Debug certificate."
            exit 1
          fi
          echo "Signature verification passed (not a debug certificate)."

      - name: Locate release AAB
        id: findaab
        run: |
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -z "$AAB" ]; then
            echo "::error::No release AAB found."
            exit 1
          fi
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          echo "Found AAB: $AAB"

      - name: Upload signed APK (for local install/testing)
        uses: actions/upload-artifact@v4
        with:
          name: cooknivo-release-apk
          path: ${{ steps.findapk.outputs.apk }}
          if-no-files-found: error

      - name: Upload signed AAB (for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: cooknivo-release-aab
          path: ${{ steps.findaab.outputs.aab }}
          if-no-files-found: error
